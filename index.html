  if(tab==="lib"&&S.books.length)grid();
}
function openSheet(h){var s=$("#sheet");s.innerHTML='<div class="grab" id="grab"><i></i></div>'+h;s.style.transform="";s.classList.add("open");$("#scrim").classList.add("open")}
function close(){var s=$("#sheet");s.style.transform="";s.classList.remove("open");$("#scrim").classList.remove("open");if(document.activeElement)document.activeElement.blur()}
function toast(t,undo){var e=$("#toast");e.innerHTML=t+(undo?'<button data-a="undo">Deshacer</button>':"");e.classList.add("on");clearTimeout(tm);tm=setTimeout(function(){e.classList.remove("on")},undo?5000:2000)}
function starsH(){var h="";for(var i=1;i<=5;i++)h+='<button data-a="star" data-n="'+i+'" class="'+(i<=E.r?"on":"")+'">★</button>';return h}
function segH(){return Object.keys(ST).map(function(k){return'<button data-a="st" data-k="'+k+'" class="'+(E.s===k?"on":"")+'">'+(k==="pendiente"?"Por leer":ST[k])+'</button>'}).join("")}
function thumbH(){return(E.cv?'<img src="'+E.cv+'" alt="">':ic("image",26)+'<span>Portada</span>')}
function refreshCover(){$("#cvw").innerHTML='<button class="thumb" data-a="pc">'+thumbH()+'</button>'+(E.cv?'<button class="lk" data-a="rc">Quitar portada</button>':"")}
function fileH(){var has=E.file||(E.fname&&!E.rmf);return has?'<div class="fr">'+ic("file",20)+'<span>'+esc(E.fname)+'</span>'+(E.file?'':'<button class="lk" data-a="of" style="padding:0">Abrir</button>')+'<button class="lk" data-a="rf" style="padding:0;color:#ff3b30">Quitar</button></div>':'<button class="btn sec" data-a="pf" style="display:flex;gap:8px;align-items:center;justify-content:center">'+ic("file",18)+'Adjuntar archivo (PDF, EPUB…)</button>'}
function openBook(id){
  var b=id?S.books.filter(function(x){return x.id==id})[0]:{s:"leyendo"};
  E={id:id||Date.now(),isNew:!id,s:b.s,r:+b.r||0,cv:id&&C[id]||null,cvChanged:0,file:null,fname:b.f||"",rmf:0};
  openSheet('<h2>'+(id?"Tu libro":"Nuevo libro")+'</h2><div class="top"><div id="cvw"></div><div style="flex:1;min-width:0"><label style="margin-top:0">Título</label><input id="ft" placeholder="Título del libro" value="'+esc(b.t)+'"><label>Autor/a</label><input id="fa" placeholder="Autor/a" value="'+esc(b.a)+'"></div></div><label>Género</label><input id="fg" list="gl" placeholder="Elige o escribe uno" value="'+esc(b.g)+'"><datalist id="gl">'+GENS.map(function(g){return'<option value="'+g+'">'}).join("")+'</datalist><label>Páginas</label><input id="fp" type="number" inputmode="numeric" placeholder="Opcional" value="'+esc(b.p)+'"><label>¿En qué estado está?</label><div class="seg" id="seg" style="margin:0">'+segH()+'</div><div id="sd" style="display:'+(E.s!=="pendiente"?"block":"none")+'"><label>Fecha en que lo empezaste</label><input id="fd0" type="date" value="'+esc(b.ds||(id?"":today()))+'"></div><div id="rd" style="display:'+(E.s==="leido"?"block":"none")+'"><label>Tu nota (toca una estrella)</label><div class="stars" id="stars">'+starsH()+'</div><label>Fecha en que lo terminaste</label><input id="fd" type="date" value="'+esc(b.d||today())+'"></div><label>Archivo del libro</label><div id="fw">'+fileH()+'</div><label>Tus notas o reseña</label><textarea id="fn" rows="3" placeholder="Lo que quieras recordar">'+esc(b.n)+'</textarea><button class="btn" id="sv" data-a="save" style="margin-top:18px"'+(b.t?"":" disabled")+'>Guardar</button>'+(id?'<button class="del" data-a="del">Eliminar libro</button>':""));
  refreshCover();
}
function saveBook(){
  var o={t:$("#ft").value.trim(),a:$("#fa").value.trim(),p:$("#fp").value,s:E.s,r:E.s==="leido"?E.r:0,d:E.s==="leido"?$("#fd").value||today():"",n:$("#fn").value.trim(),g:$("#fg").value.trim(),ds:E.s==="pendiente"?"":($("#fd0").value||(E.s==="leyendo"?today():""))},id=E.id;
  if(E.cvChanged){if(E.cv){C[id]=E.cv;o.hc=1;iop("put","c:"+id,E.cv)}else{delete C[id];o.hc=0;iop("del","c:"+id)}}
  if(E.file){o.f=E.fname;iop("put","f:"+id,E.file)}else if(E.rmf){o.f="";iop("del","f:"+id)}
  if(E.isNew){o.id=id;S.books.push(o)}else S.books=S.books.map(function(b){return b.id==id?Object.assign(b,o):b});
  filt="all";q="";save();close();render();toast("Guardado ✓");
}
var removed;
function help(){S.seen=1;save();openSheet('<h2>Bienvenida</h2><div class="step"><em>1</em><p><b>Añade tus libros</b><br><small>Pulsa «Añadir libro». Solo el título es obligatorio; puedes poner portada y adjuntar el archivo.</small></p></div><div class="step"><em>2</em><p><b>Toca un libro para cambiarlo</b><br><small>Márcalo como leyendo o leído, ponle nota y escribe tu reseña.</small></p></div><div class="step"><em>3</em><p><b>Mira tu progreso</b><br><small>En Estadísticas verás tus páginas, tu nota media y tu meta del año.</small></p></div><div class="step"><em>4</em><p><b>Haz una copia de seguridad</b><br><small>En Ajustes, de vez en cuando. Así nunca pierdes nada.</small></p></div><button class="btn" data-a="close">Entendido</button>')}
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");if(!el)return;var a=el.dataset.a;
  if(a==="tab"){tab=el.dataset.t;render();scrollTo(0,0)}
  else if(a==="f"){filt=el.dataset.f;render()}
  else if(a==="add")openBook(null);
  else if(a==="open")openBook(el.dataset.id);
  else if(a==="close")close();
  else if(a==="help")help();
  else if(a==="st"){E.s=el.dataset.k;$("#seg").innerHTML=segH();$("#rd").style.display=E.s==="leido"?"block":"none";$("#sd").style.display=E.s==="pendiente"?"none":"block";var f0=$("#fd0");if(E.s==="leyendo"&&!f0.value)f0.value=today();if(E.s==="leido"&&E.isNew&&f0.value===today())f0.value=""}
  else if(a==="star"){E.r=E.r==+el.dataset.n?0:+el.dataset.n;$("#stars").innerHTML=starsH()}
  else if(a==="save")saveBook();
  else if(a==="del"){var i=S.books.findIndex(function(b){return b.id==E.id}),rb=S.books[i];removed={b:rb,i:i};S.books.splice(i,1);save();close();render();toast("Libro eliminado",1);setTimeout(function(){if(removed&&removed.b===rb){iop("del","c:"+rb.id);iop("del","f:"+rb.id);delete C[rb.id];removed=null}},6000)}
  else if(a==="pc")$("#fc").click();
  else if(a==="rc"){E.cv=null;E.cvChanged=1;refreshCover()}
  else if(a==="pf")$("#ff").click();
  else if(a==="rf"){E.file=null;E.rmf=1;E.fname="";$("#fw").innerHTML=fileH()}
  else if(a==="of"){iop("get","f:"+E.id).then(function(f){if(!f)return toast("No encuentro el archivo");var u=URL.createObjectURL(f);if(!window.open(u,"_blank"))toast("El navegador bloqueó la apertura")})}
  else if(a==="undo"){if(removed){S.books.splice(removed.i,0,removed.b);removed=null;save();render();toast("Recuperado ✓")}}
  else if(a==="cp"){var t=JSON.stringify({books:S.books,goal:S.goal});$("#bk").value=t;try{navigator.clipboard.writeText(t).then(function(){toast("Copiado ✓")},function(){$("#bk").select()})}catch(x){$("#bk").select()}}
  else if(a==="rs"){try{var j=JSON.parse($("#bk").value);if(!Array.isArray(j.books))throw 0;S.books=j.books.map(function(b,i){b.id=b.id||Date.now()+i;return b});S.goal=j.goal||0;save();render();toast("Restaurado ✓")}catch(x){toast("El texto no es válido")}}
});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){q=e.target.value;grid()}
  if(e.target.id==="ft")$("#sv").disabled=!e.target.value.trim();
  if(e.target.id==="goal"){S.goal=+e.target.value||0;save()}
});
document.addEventListener("change",function(e){var t=e.target,f=t.files&&t.files[0];
  if(t.id==="goal")render();
  if(t.id==="fc"&&f)resize(f,function(d){E.cv=d;E.cvChanged=1;refreshCover()});
  if(t.id==="ff"&&f){E.file=f;E.fname=f.name;E.rmf=0;$("#fw").innerHTML=fileH()}
  if(t.type==="file")t.value=""});
(function(){var y0,y1,t0,v=0,on=0,s=$("#sheet");
  s.addEventListener("pointerdown",function(e){if(!e.target.closest("#grab"))return;on=1;y0=y1=e.clientY;t0=e.timeStamp;s.setPointerCapture(e.pointerId);s.style.transition="none"});
  s.addEventListener("pointermove",function(e){if(!on)return;var d=Math.max(0,e.clientY-y0);v=(e.clientY-y1)/Math.max(1,e.timeStamp-t0);y1=e.clientY;t0=e.timeStamp;s.style.transform="translateY("+d+"px)"});
  s.addEventListener("pointerup",function(e){if(!on)return;on=0;s.style.transition="";if(e.clientY-y0>120||v>.6)close();else s.style.transform=""});
})();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
load();render();if(!S.seen)setTimeout(help,500);idb().then(loadCovers).then(function(){if(tab==="lib")render()});
</script></body></html>
